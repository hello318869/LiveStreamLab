# Independent platform example for SRS 8.0.58, source commit:
# 89bdba34ba55175008a1f7749f11d842a90ca6b7
# N03: deployment template only. Replace the hook-secret placeholders first.
# This file has not been applied or tested.
# Keep the existing /home/asusjian/srs/trunk/conf/srs.conf unchanged.
# Relative filesystem paths below are relative to the SRS trunk working directory.
# See ../docs/platform-srs-baseline.md and ../docs/platform-deployment.md.

max_connections 1000;
daemon off;
srs_log_tank console;

rtmp {
    listen 1935;
}

# The backend and this SRS instance must share a host/network namespace to use
# this loopback management endpoint. Cross-host/container deployments must use
# a reachable private management address and adjust the backend internal base.
http_api {
    enabled on;
    listen 127.0.0.1:1985;
    crossdomain off;
}

http_server {
    enabled on;
    listen 8080;
    dir ./objs/nginx/html;
}

vhost __defaultVhost__ {
    http_remux {
        enabled on;
        mount [vhost]/[app]/[stream].flv;
    }

    # Configure the backend's srs.trusted_sources with the actual SRS peer IP,
    # set LSL_SRS_HOOK_SECRET to a random 32-byte base64url string (43 chars),
    # and replace BOTH placeholders with the SAME secret before deployment.
    # The unsubstituted template denies publishing instead of bypassing auth.
    # 127.0.0.1 assumes SRS and control_server share the same network namespace.
    # Keep hook URLs, param bodies and publish credentials out of ordinary logs.
    http_hooks {
        enabled on;
        on_publish http://127.0.0.1:8090/internal/srs/hooks?key=REPLACE_WITH_LSL_SRS_HOOK_SECRET;
        on_unpublish http://127.0.0.1:8090/internal/srs/hooks?key=REPLACE_WITH_LSL_SRS_HOOK_SECRET;
    }
}

# HLS and RTC are omitted; their defaults are off in the fixed source version.
# Review SRS_* environment overrides before a later deployment.
